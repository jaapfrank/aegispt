services:
  aegispt-lab-suite:
    build: .
    image: aegispt-lab-suite:local
    environment:
      AEGISPT_LAB_FLAG_SEED: ${AEGISPT_LAB_FLAG_SEED:-aegispt-local-lab-suite-default-seed}
      AEGISPT_LAB_HOST: 0.0.0.0
      AEGISPT_LAB_PORT: 8080
    ports:
      - "127.0.0.155:8088:8080"
    healthcheck:
      test:
        [
          "CMD",
          "python3",
          "-c",
          "import json, urllib.request; print(json.load(urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=2))['status'])",
        ]
      interval: 5s
      timeout: 3s
      retries: 20

  aegispt-lab-printer:
    build: .
    image: aegispt-lab-suite:local
    command: ["python3", "network_services.py", "printer", "0.0.0.0", "9100"]
    environment:
      AEGISPT_LAB_FLAG_SEED: ${AEGISPT_LAB_FLAG_SEED:-aegispt-local-lab-suite-default-seed}
    ports:
      - "127.0.0.156:9100:9100"
    healthcheck:
      test:
        [
          "CMD",
          "python3",
          "-c",
          "import socket; s=socket.create_connection(('127.0.0.1', 9100), 2); print(s.recv(80).decode())",
        ]
      interval: 5s
      timeout: 3s
      retries: 20

