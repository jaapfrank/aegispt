name: app-v2-tests

on:
  pull_request:
    paths:
      - ".github/workflows/app-v2-tests.yml"
      - "scripts/run_app_v2_tests.sh"
      - "ui-v2/**"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  app-v2-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: ui-v2/package-lock.json
      - name: Install React v2 dependencies
        working-directory: ui-v2
        run: npm ci
      - name: Install React v2 Playwright browser
        working-directory: ui-v2
        run: npx playwright install --with-deps chromium
      - name: Run React /app-v2 tests
        run: bash scripts/run_app_v2_tests.sh
