name: validation-matrix

on:
  schedule:
    - cron: "23 3 * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - "api/app/services/finding*.py"
      - "workers/**"
      - "scripts/run_validation_matrix.py"
      - "scripts/validation/**"
      - "scripts/tests/test_validation_runner.py"
      - "codex/tasks/backlog-99-known-vulnerability-validation-matrix.json"
      - ".github/workflows/validation-matrix.yml"

jobs:
  validation-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      AEGISPT_BASE_URL: http://127.0.0.1:8000
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/dev.txt

      - name: Validate backlog task mapping
        run: python3 scripts/validate_backlog_tasks.py

      - name: Run validation matrix unit tests
        run: python3 -m pytest scripts/tests/test_validation_runner.py

      - name: Run known-vulnerability matrix
        run: |
          python3 scripts/run_validation_matrix.py \
            --catalog scripts/validation/expected_findings.json \
            --results-file codex/results/validation-matrix-latest.json

      - name: Upload validation matrix result
        uses: actions/upload-artifact@v4
        with:
          name: validation-matrix-latest
          path: codex/results/validation-matrix-latest.json

      - name: Notify Slack on failure
        if: failure() && env.SLACK_WEBHOOK_URL != ''
        run: |
          curl -fsS -X POST \
            -H 'Content-Type: application/json' \
            --data '{"text":"AegisPT validation matrix failed. Check the GitHub Actions run artifact validation-matrix-latest."}' \
            "$SLACK_WEBHOOK_URL"
